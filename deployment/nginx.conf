# ═══════════════════════════════════════════════════════════════════════════════
# NGINX REVERSE PROXY CONFIGURATION FOR SMARTAPP
# ═══════════════════════════════════════════════════════════════════════════════
#
# Location: /etc/nginx/sites-available/smartapp
# Enable with: sudo ln -s /etc/nginx/sites-available/smartapp /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload: sudo systemctl reload nginx

# Upstream Flask application
upstream smartapp_backend {
    # Load balancing with multiple Gunicorn workers
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=30s backup;
    
    # Keep-alive connections
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ───────────────────────────────────────────────────────────────────────────────────
# HTTP → HTTPS REDIRECT (Port 80)
# ───────────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ───────────────────────────────────────────────────────────────────────────────────
# HTTPS SERVER (Port 443)
# ───────────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;
    
    # ─ SSL CONFIGURATION ────────────────────────────────────────────────────────────
    
    # SSL Certificates (use Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # SSL Protocol & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # SSL Stapling (performance optimization)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_stapling_responder_timeout 5s;
    ssl_stapling_return_errors off;
    
    # HSTS (Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # ─ SECURITY HEADERS ────────────────────────────────────────────────────────────
    
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: wss:; frame-ancestors 'none';" always;
    
    # Remove server version
    server_tokens off;
    
    # ─ LOGGING ─────────────────────────────────────────────────────────────────────
    
    access_log /var/log/nginx/smartapp_access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/smartapp_error.log warn;
    
    # ─ GZIP COMPRESSION ────────────────────────────────────────────────────────────
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # ─ PERFORMANCE TUNING ──────────────────────────────────────────────────────────
    
    client_max_body_size 50M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    keepalive_requests 100;
    
    # ─ BUFFER SIZES ────────────────────────────────────────────────────────────────
    
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # ───────────────────────────────────────────────────────────────────────────────
    # LOCATION: STATIC FILES (React build)
    # ───────────────────────────────────────────────────────────────────────────────
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /opt/smartapp/web-panel/build$uri;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    
    # ───────────────────────────────────────────────────────────────────────────────
    # LOCATION: MANIFEST & ICONS
    # ───────────────────────────────────────────────────────────────────────────────
    
    location ~ ^/(manifest\.json|favicon\.ico|apple-touch-icon\.png)$ {
        alias /opt/smartapp/web-panel/build$uri;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }
    
    # ───────────────────────────────────────────────────────────────────────────────
    # LOCATION: API ENDPOINTS
    # ───────────────────────────────────────────────────────────────────────────────
    
    location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy headers
        proxy_pass http://smartapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # ───────────────────────────────────────────────────────────────────────────────
    # LOCATION: HEALTH CHECK
    # ───────────────────────────────────────────────────────────────────────────────
    
    location /health {
        proxy_pass http://smartapp_backend;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # ───────────────────────────────────────────────────────────────────────────────
    # LOCATION: AUTHENTICATION ENDPOINTS (Rate limited)
    # ───────────────────────────────────────────────────────────────────────────────
    
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        
        proxy_pass http://smartapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ───────────────────────────────────────────────────────────────────────────────
    # LOCATION: WEBSOCKET SUPPORT (if needed)
    # ───────────────────────────────────────────────────────────────────────────────
    
    location /ws/ {
        proxy_pass http://smartapp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_read_timeout 86400;
    }
    
    # ───────────────────────────────────────────────────────────────────────────────
    # LOCATION: SPA FALLBACK (React routing)
    # ───────────────────────────────────────────────────────────────────────────────
    
    location / {
        # Try file, then directory, then fallback to index.html for SPA
        try_files $uri $uri/ /index.html;
        
        # Serve from React build
        alias /opt/smartapp/web-panel/build/;
        
        # Cache control for HTML
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # ───────────────────────────────────────────────────────────────────────────────
    # ERROR PAGES
    # ───────────────────────────────────────────────────────────────────────────────
    
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
    
    location ~ ^/(404|500)\.html$ {
        alias /opt/smartapp/web-panel/build$uri;
        expires -1;
    }
    
    # ───────────────────────────────────────────────────────────────────────────────
    # DENY ACCESS TO SENSITIVE FILES
    # ───────────────────────────────────────────────────────────────────────────────
    
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# NOTES:
# ═══════════════════════════════════════════════════════════════════════════════
# 1. Replace "yourdomain.com" with your actual domain
# 2. Update paths to match your deployment directory
# 3. Generate SSL certificates with: sudo certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
# 4. Run multiple Gunicorn instances for redundancy
# 5. Monitor logs in: /var/log/nginx/smartapp_*
# 6. Test configuration: sudo nginx -t
# 7. Reload Nginx: sudo systemctl reload nginx
