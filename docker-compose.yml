version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
# Docker Compose for SmartApp - AWS EC2 Ubuntu Deployment
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   Development:   docker-compose up
#   Production:    docker-compose -f docker-compose.yml up -d
#   Build:         docker-compose build
#   Logs:          docker-compose logs -f
#   Stop:          docker-compose down

services:
  # ─────────────────────────────────────────────────────────────────────────
  # MySQL Database Service (External IHS cPanel)
  # ─────────────────────────────────────────────────────────────────────────

  # Note: Using external MySQL database (IHS cPanel)
  # Uncomment below if you want to run local MySQL container instead

  # db:
  #   image: mysql:8.0
  #   container_name: smartapp-mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
  #     MYSQL_DATABASE: ${DB_NAME:-smart_attendance}
  #     MYSQL_USER: ${DB_USER:-smartapp_user}
  #     MYSQL_PASSWORD: ${DB_PASSWORD:-smartapp_pass}
  #   ports:
  #     - "3306:3306"
  #   networks:
  #     - smartapp-network
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # ─────────────────────────────────────────────────────────────────────────
  # Backend Flask Application
  # ─────────────────────────────────────────────────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartapp-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - DB_DRIVER=mysql
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-3306}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:80,https://yourdomain.com
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    networks:
      - smartapp-network
    volumes:
      - ./static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend React Application
  # ─────────────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartapp-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://backend:8000
    ports:
      - "80:80"
    networks:
      - smartapp-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  smartapp-network:
    driver: bridge

volumes:
  mysql_data:
    container_name: smartapp-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - smartapp-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana Dashboards (Optional)
  # ─────────────────────────────────────────────────────────────────────────
  
  grafana:
    image: grafana/grafana:latest
    container_name: smartapp-grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - smartapp-network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────

networks:
  smartapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  nginx-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-storage:
    driver: local

# ═════════════════════════════════════════════════════════════════════════════
# USAGE:
#
# 1. Environment setup:
#    cp .env.example .env.docker
#    Edit .env.docker with real values
#
# 2. Build and start all services:
#    docker-compose up -d
#
# 3. View logs:
#    docker-compose logs -f smartapp
#
# 4. Execute commands in container:
#    docker-compose exec smartapp bash
#
# 5. Stop all services:
#    docker-compose down
#
# 6. Remove all data (including volumes):
#    docker-compose down -v
#
# 7. Backup database:
#    docker-compose exec mongodb mongodump --archive=/backup/smartapp.archive
