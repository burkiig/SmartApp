version: '3.9'

# ═══════════════════════════════════════════════════════════════════════════════
# Docker Compose for SmartApp - Production Setup
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage:
#   Development:   docker-compose up
#   Production:    docker-compose -f docker-compose.yml up -d
#   Build:         docker-compose build
#   Logs:          docker-compose logs -f smartapp
#   Shell:         docker-compose exec smartapp bash

services:

  # ─────────────────────────────────────────────────────────────────────────
  # MongoDB Database Service
  # ─────────────────────────────────────────────────────────────────────────
  
  mongodb:
    image: mongo:6.0-alpine
    container_name: smartapp-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: smart_attendance_prod
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./deployment/mongodb-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"
    networks:
      - smartapp-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

  # ─────────────────────────────────────────────────────────────────────────
  # SmartApp Flask Application
  # ─────────────────────────────────────────────────────────────────────────
  
  smartapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartapp-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DB_DRIVER: ${DB_DRIVER:-mongodb}
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-changeme}@mongodb:27017/?authSource=admin
      MONGODB_DATABASE: smart_attendance_prod
      HOST: 0.0.0.0
      PORT: 5000
      WORKERS: ${WORKERS:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./static/faces:/app/static/faces
      - ./static/attendance:/app/static/attendance
      - ./logs:/app/logs
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5000:5000"
    networks:
      - smartapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=smartapp"

  # ─────────────────────────────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────────────────────────────────────
  
  nginx:
    image: nginx:alpine
    container_name: smartapp-nginx
    restart: always
    depends_on:
      - smartapp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-panel/build:/usr/share/nginx/html:ro
      - ./static:/app/static:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - smartapp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/nginx
      - /var/cache/nginx
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=nginx"

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus Monitoring (Optional)
  # ─────────────────────────────────────────────────────────────────────────
  
  prometheus:
    image: prom/prometheus:latest
    container_name: smartapp-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - smartapp-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana Dashboards (Optional)
  # ─────────────────────────────────────────────────────────────────────────
  
  grafana:
    image: grafana/grafana:latest
    container_name: smartapp-grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - smartapp-network
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────

networks:
  smartapp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  nginx-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-storage:
    driver: local

# ═════════════════════════════════════════════════════════════════════════════
# USAGE:
#
# 1. Environment setup:
#    cp .env.example .env.docker
#    Edit .env.docker with real values
#
# 2. Build and start all services:
#    docker-compose up -d
#
# 3. View logs:
#    docker-compose logs -f smartapp
#
# 4. Execute commands in container:
#    docker-compose exec smartapp bash
#
# 5. Stop all services:
#    docker-compose down
#
# 6. Remove all data (including volumes):
#    docker-compose down -v
#
# 7. Backup database:
#    docker-compose exec mongodb mongodump --archive=/backup/smartapp.archive
